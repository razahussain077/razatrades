services:
  - type: web
    name: swiftlabor-forex-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swiftlabor-market-db
          property: connectionString
      - key: BRIDGE_TOKEN
        generateValue: true
      - key: DASHBOARD_API_TOKEN
        sync: false
      - key: TENANT_ID
        value: equiti-client
      - key: SCAN_INTERVAL_SECONDS
        value: "15"
      - key: STALE_AFTER_SECONDS
        value: "180"
      - key: MAX_QUOTE_AGE_SECONDS
        value: "300"
      - key: MAX_BARS_PER_STREAM
        value: "200"
      - key: RETENTION_DAYS
        value: "90"
      - key: DB_POOL_MAX
        value: "6"
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: swiftlabor-market-db
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "18"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
    databaseName: swiftlabor_market
    user: swiftlabor
